services:
  backend:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - AI_PROVIDER=mock
    volumes:
      - ./services/api:/app
      - ./uploads:/app/uploads
      - ./reports/generated:/app/reports/generated
    networks:
      - socmat

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      # Tells the Vite dev-server proxy where to forward /api/* requests.
      # Uses the Docker Compose service name so container-to-container routing works.
      - VITE_BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - socmat

networks:
  socmat:
    driver: bridge
